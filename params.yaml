seed: 42

data:
  path: data/datos_credito_eu_ai_act.csv
  n_rows: 600

train:
  test_size: 0.25
  n_estimators: 100
  max_depth: 5
  mitigation_constraint: demographic_parity

governance:
  protected_attribute: genero
  max_dp_difference: 0.12
  min_accuracy: 0.78
  max_accuracy_drop_mitigation: 0.10
  human_review_band: [0.40, 0.60]
  log_retention_days: 183

project:
  name: flexiscore-UNAB

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: flexiscore-UNAB
  registered_model: flexiscore-UNAB